<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0D">
<title>Центр спорта «Рекорд» — Иркутск</title>
<meta name="description" content="Центр спорта «Рекорд»: функциональные тренировки, тяжёлая атлетика, кикбоксинг и детские группы. Соревнования, регистрация и лидерборд.">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
html{color-scheme:dark}body{margin:0;background:#070707}img{max-width:100%}[hidden]{display:none!important}

@font-face{font-family:"Unbounded";src:url(/fonts/unbounded.woff) format("woff");font-weight:200 900;font-display:swap}
@font-face{font-family:"Golos Text";src:url(/fonts/golos.woff) format("woff");font-weight:400 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jbmono.woff) format("woff");font-weight:100 800;font-display:swap}
.cfoot .docs{display:flex;flex-wrap:wrap;gap:6px 16px}.cfoot .docs a{color:var(--muted)}
.check a,.fine a{color:var(--accent)}
.codebox{font-family:var(--f-mono);font-size:24px;letter-spacing:.3em;text-align:center}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
/* Layout: one phone-width app column, dark arena ground, scoreboard yellow as the only accent */
:root{
  --bg:#0E0E0D; --ground:#070707; --surface:#181816; --surface-2:#22211E; --line:#33312B;
  --fg:#F3F1EA; --muted:#9A968B; --dim:#6B675E;
  --accent:#F7B100; --accent-ink:#141210; --accent-soft:rgba(247,177,0,.14);
  --good:#3FBF78; --good-soft:rgba(63,191,120,.14);
  --bad:#E35A4F; --bad-soft:rgba(227,90,79,.14);
  --gold:#F7B100; --silver:#C9CDD3; --bronze:#C9824A;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-s:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;border-inline:1px solid #151513}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;height:56px;padding-inline:16px;background:rgba(14,14,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center}
.top h1{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex:1}
.mark i{width:10px;height:22px;background:var(--accent);display:inline-block;transform:skewX(-14deg)}
.demo-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
main{padding:16px 16px 104px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.sp{flex:1;min-width:0}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.06)}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.dark{background:var(--fg);color:var(--accent-ink)}
.btn.sm{height:36px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{background:var(--surface-2);color:var(--dim);cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.chip.open{background:var(--good-soft);color:var(--good)}
.chip.live{background:var(--bad-soft);color:var(--bad)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
.chip.ended{background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--accent-soft);color:var(--accent)}
.chip.full{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* hero */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:272px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;background:#111 center/cover no-repeat;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,9,.15) 0%,rgba(10,10,9,.55) 45%,rgba(10,10,9,.96) 100%);z-index:-1}
.hero .kicker{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:4px}
.hero .word{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,22vw,104px);line-height:.86;letter-spacing:-.02em;margin:12px 0 6px}
.hero .word span{color:var(--accent)}
.hero p{margin:0 0 16px;color:#D9D5CB;max-width:34ch}
.hero .row .btn{flex:1}
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.datebox{width:64px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-align:center;padding:8px 0}
.datebox b{display:block;font-family:var(--f-display);font-size:24px;line-height:1}
.datebox span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.count{display:flex;gap:8px;margin-top:10px}
.count div{flex:1;background:var(--surface-2);border-radius:8px;padding:8px;text-align:center}
.count b{font-family:var(--f-mono);font-size:20px;display:block}
.count span{font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.quick svg{color:var(--accent)}

/* event cards */
.ev{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden}
.ev .band{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--accent-ink) 10px 20px)}
.ev.dim .band{background:repeating-linear-gradient(-45deg,var(--surface-2) 0 10px,var(--bg) 10px 20px)}
.ev .in{padding:14px}
.ev h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:0;background:none;border-radius:9px;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.utabs{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.utabs button{border:0;background:none;padding:10px 0;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.utabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.pills button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* info list */
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.refund{display:flex;flex-direction:column;gap:8px}
.refund div{display:flex;gap:10px;align-items:center;font-size:13px}
.refund .chip{min-width:58px;justify-content:center}
.timeline{display:flex;flex-direction:column}
.timeline .it{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.timeline .it:last-child{border:0}
.timeline b{font-family:var(--f-mono);color:var(--accent)}
.wod{border-left:3px solid var(--accent);padding-left:12px}
.wod h4{margin:0 0 4px;font-size:15px}
.wod ul{margin:6px 0 0;padding-left:18px;color:#D9D5CB;font-size:14px}

/* division cards */
.div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.div h4{margin:0;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.div .price{font-family:var(--f-mono);font-weight:700;font-size:18px}
.div .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.div .bar i{display:block;height:100%;background:var(--accent)}
.div.off{opacity:.55}
.div.off .bar i{background:var(--dim)}
.why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.inp{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:15px;color:var(--fg);width:100%}
.inp:focus{border-color:var(--accent);outline:none}
.inp.err{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#D9D5CB}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.err-t{color:var(--bad);font-size:12.5px}
.ok-t{color:var(--good);font-size:12.5px}
.sum{display:flex;justify-content:space-between;align-items:baseline}
.sum b{font-family:var(--f-mono);font-size:22px}
.sticky-cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(14,14,13,0),var(--bg) 30%);z-index:25}

/* teams */
.team{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.team b{font-family:var(--f-display);font-weight:600;font-size:14px}
.slots{display:flex;gap:4px;margin-top:6px}
.slots i{width:16px;height:6px;border-radius:2px;background:var(--surface-2)}
.slots i.on{background:var(--accent)}

/* leaderboard */
.lb-head{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:8px 12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.lb{display:flex;flex-direction:column;gap:6px}
.lr{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.lr.me{border-color:var(--accent)}
.lr.r1{box-shadow:inset 3px 0 0 var(--gold)} .lr.r2{box-shadow:inset 3px 0 0 var(--silver)} .lr.r3{box-shadow:inset 3px 0 0 var(--bronze)}
.lr>button{width:100%;border:0;background:none;display:grid;grid-template-columns:34px 40px 1fr auto 14px;gap:10px;align-items:center;padding:10px 12px;text-align:left}
.rk{font-family:var(--f-mono);font-weight:700;font-size:15px;text-align:center;color:var(--muted)}
.r1 .rk{color:var(--gold)} .r2 .rk{color:var(--silver)} .r3 .rk{color:var(--bronze)}
.av{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted)}
.nm{min-width:0}
.nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:12px;color:var(--muted)}
.pts{font-family:var(--f-mono);font-weight:700;font-size:19px;text-align:right}
.pts small{font-size:10px;color:var(--muted);margin-left:2px;font-weight:500}
.r1 .pts,.r2 .pts,.r3 .pts{color:var(--accent)}
.chev{color:var(--dim);transition:transform .2s}
.lr.open .chev{transform:rotate(180deg)}
.split{display:none;padding:0 12px 12px 56px}
.lr.open .split{display:block}
.split table{width:100%;border-collapse:collapse;font-size:13px}
.split th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:4px 0}
.split td{padding:6px 0;border-top:1px solid var(--line)}
.split td:nth-child(2),.split th:nth-child(2){text-align:center}
.split td:last-child,.split th:last-child{text-align:right}
.split .mono.first{color:var(--accent)}
.rule{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.selbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.selbtn b{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase}
.filters{display:grid;grid-template-columns:1fr 46px;gap:8px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.iconbtn{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,480px);max-height:80vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.opt{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;font-weight:600}
.opt[aria-selected="true"]{color:var(--accent)}

/* orders */
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.order .hd{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface-2)}
.order .bd{padding:14px}
.order .acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.panel{margin:0 14px 14px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}

/* profile */
.pcard{background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px}
.big-av{width:60px;height:60px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stats b{font-family:var(--f-mono);font-size:20px;display:block}
.stats b.acc{color:var(--accent)}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.menu button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 14px;text-align:left;font-weight:600}
.menu button:last-child{border:0}
.menu svg{color:var(--accent)}

/* pay / result */
.center{text-align:center;padding:24px 8px}
.big-ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.paybox{background:#F4F3EF;color:#1A1A1A;border-radius:14px;padding:18px}
.paybox .inp{background:#fff;border-color:#D8D6CF;color:#1A1A1A}
#qr{display:block;margin:0 auto;border-radius:12px;background:#fff;padding:12px;max-width:100%}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(14,14,13,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tabbar button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--fg);color:var(--accent-ink);font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:12px}
.foot{margin-top:28px;font-size:12px;color:var(--dim);text-align:center}
/* organizer panel */
.stats.flat div{background:var(--surface);border:1px solid var(--line)}
.arow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow b{font-size:14.5px}
.iconbtn.sm{width:36px;height:36px;flex:none}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
textarea.inp{font-family:var(--f-body);height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.45}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:6px 8px 6px 0}
.tbl td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.minibar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:6px;max-width:160px}
.minibar i{display:block;height:100%;background:var(--accent)}
.btn.danger{background:transparent;border-color:var(--bad-soft);color:var(--bad)}
.pills.wrap{flex-wrap:wrap;overflow:visible}

.ev .cover{aspect-ratio:16/6;background:#222 center/cover no-repeat}
.evcover{aspect-ratio:16/7;border-radius:12px;background:#222 center/cover no-repeat;margin-bottom:12px}
.imgprev{aspect-ratio:16/9;max-width:520px;border-radius:10px;background:var(--surface-2) center/cover no-repeat;display:flex;align-items:flex-start;justify-content:flex-end;padding:8px}
.imgprev.empty-img{align-items:center;justify-content:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);text-align:center}
.mark .logo{height:17px;width:auto;display:block;color:var(--fg)}
.hero{--cap:min(69px,calc((100vw - 72px)*.133))}
.hero .word .logo{display:block;height:var(--cap);width:auto;max-width:none;color:#fff;margin:6px auto calc(var(--cap)*.19 + 4px);overflow:visible}
.hero .word{width:100%;max-width:calc(var(--cap)*7.201)}
.hero.en>:not(.word){margin-left:calc(var(--cap)*.068)}

/* ---------- ranking ---------- */
function keyOf(type, v){
  if (v===null || v===undefined) return null;
  if (type==="time") return typeof v==="number" ? [0,v] : [1,-v.cap];
  return [0,-v];
}
const cmpKey = (a,b) => a[0]-b[0] || a[1]-b[1];
function rankWorkout(rows, idx, type){
  const n = rows.length, out = new Array(n).fill(n+1);
  const withKey = rows.map((r,i)=>({i,k:keyOf(type,r.r[idx])})).filter(x=>x.k);
  withKey.sort((a,b)=>cmpKey(a.k,b.k));
  withKey.forEach((x,j)=>{ out[x.i] = (j>0 && cmpKey(withKey[j-1].k,x.k)===0) ? out[withKey[j-1].i] : j+1; });
  return out;
}
/* permanent league: one start all year round, results summed up every month */
const MON_NOM = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];

const cap1 = t => t[0].toUpperCase()+t.slice(1);
const monthTitle = id => cap1(MON_NOM[+id.slice(5,7)-1]);
const nextMonthId = id => { let [y,m]=id.split("-").map(Number); m++; if (m>12){ m=1; y++; } return `${y}-${String(m).padStart(2,"0")}`; };
const monthEnd = id => { const [y,m]=id.split("-").map(Number); return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10); };
const curMonth = ev => (ev.months||[]).find(m=>!m.done) || (ev.months||[]).slice(-1)[0] || {id:TODAY.slice(0,7)};
const lbEv = (ev, month) => ev.permanent ? {...ev, workouts: ev.workouts.filter(w=>w.month===month)} : ev;
const resKey = (ev, div, month) => ev.permanent ? `${ev.id}@${month}:${div}` : `${ev.id}:${div}`;
function leagueYear(ev, divId){
  const ms = (ev.months||[]).filter(m=>RESULTS[resKey(ev,divId,m.id)]), sizes=[], map=new Map();
  ms.forEach((m,mi)=>{ const {rows}=leaderboard(ev.id,divId,m.id); sizes[mi]=rows.length;
    rows.forEach(r=>{ if (!map.has(r.n)) map.set(r.n,{n:r.n,a:r.a,me:r.me,team:r.team,r:ms.map(()=>null)}); map.get(r.n).r[mi]=r.place; }); });
  const rows=[...map.values()];
  rows.forEach(r=>{ r.wr=r.r.map((p,i)=>p ?? sizes[i]+1); r.pts=r.wr.reduce((a,b)=>a+b,0); r.sorted=[...r.wr].sort((a,b)=>a-b); });
  const cmp=(a,b)=>a.pts-b.pts||cmpArr(a.sorted,b.sorted);
  rows.sort(cmp); rows.forEach((r,j)=>{ r.place=(j>0&&cmp(rows[j-1],r)===0)?rows[j-1].place:j+1; });
  return {ev:{...ev, workouts:ms.map(m=>({id:m.id,name:monthTitle(m.id),type:"place"}))}, rows};
}
function leaderboard(evId, divId, month){
  const ev0 = EVENTS.find(e=>e.id===evId);
  if (!ev0) return {ev:null, rows:[]};
  const ev = lbEv(ev0, month);
  const rows = (RESULTS[resKey(ev0,divId,month)]||[]).map(r=>({...r, r:[...r.r]}));
  const ranks = ev.workouts.map((w,i)=>rankWorkout(rows,i,w.type));
  rows.forEach((r,i)=>{ r.wr = ranks.map(x=>x[i]); r.pts = r.wr.reduce((a,b)=>a+b,0); r.sorted=[...r.wr].sort((a,b)=>a-b); });
  const cmp = (a,b) => a.pts-b.pts || cmpArr(a.sorted,b.sorted) || a.wr[a.wr.length-1]-b.wr[b.wr.length-1];
  rows.sort(cmp);
  rows.forEach((r,j)=>{ r.place = (j>0 && cmp(rows[j-1],r)===0) ? rows[j-1].place : j+1; });
  return {ev, rows};
}
function cmpArr(a,b){ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
/* results typed by organizers: time "13:45" or "лимит 142", reps/kg/place a number */
function parseRes(type, raw){
  const t = String(raw||"").trim().replace(",",".");
  if (!t) return {err:"Пусто"};
  if (type==="time"){
    const m = t.match(/^(\d{1,3}):([0-5]\d)$/); if (m) return {v:+m[1]*60 + +m[2]};
    const c = t.match(/^(?:лимит|cap|кап)\s*\+?\s*(\d+)$/i); if (c) return {v:{cap:+c[1]}};
    return {err:"Время мм:сс или «лимит 142»"};
  }
  const n = Number(t); if (!isFinite(n) || n<=0) return {err:"Нужно число больше нуля"};
  return {v: type==="place" ? Math.round(n) : n};
}
const resInput = (type, v) => v===null || v===undefined ? "" : type==="time" ? (typeof v==="object" ? `лимит ${v.cap}` : fmtRes("time", v)) : String(v);
const resHint = type => type==="time" ? "13:45 или лимит 142" : type==="reps" ? "повторений" : type==="place" ? "место" : "кг";
function openWorkouts(ev){ return (ev.workouts||[]).filter(w=>!ev.permanent || !((ev.months||[]).find(m=>m.id===w.month)||{}).done); }
function fmtRes(type, v){
  if (v===null || v===undefined) return "—";
  if (type==="time"){ if (typeof v==="object") return `CAP+${v.cap}`; return `${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}`; }
  if (type==="place") return "";
  if (type==="reps") return `${v} повт.`;
  return `${v} кг`;
}

function back(){ const prev=S.stack.pop(); if(prev){ S.route=prev.route; S.p=prev.p; render(); window.scrollTo(0, prev.y||0);} else go("home",{},false); }

function tab(t){ S.stack=[]; go(t,{},false); }
function toast(msg){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
const ROOT_TAB = {login:"me",home:"home",events:"events",event:"events",divisions:"events",team:"events",teamCreate:"events",teamJoin:"events",form:"events",pay:"events",done:"events",fail:"events",leaderboard:"leaderboard",me:"me",orders:"me",score:"me",qr:"me",profile:"me",admin:"me",adminEvent:"me",adminDiv:"me",adminWod:"me",adminPeople:"me",adminSch:"me",adminPromo:"me",adminClub:"me"};

function header(title){
  if (isClub()) return clubHeader();
  if (!title) return `<button class="mark" data-tab="home" aria-label="Record, на главную">${LOGO}</button>${topnav()}${modeSw()}`;
  return `<button class="back" data-act="back" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button><h1>${esc(title)}</h1>${topnav()}${modeSw(true)}`;
}
const NAV = [["home","Главная"],["events","Старты"],["leaderboard","Лидерборд"],["me","Профиль"]];
function topnav(){ const cur = ROOT_TAB[S.route]; return `<nav class="topnav" aria-label="Разделы">${NAV.map(([k,l])=>`<button data-tab="${k}" ${cur===k?'aria-current="page"':""}>${l}</button>`).join("")}</nav>`; }
const WIDTH = {club:"wide",adminClub:"mid",home:"wide",events:"wide",leaderboard:"wide",admin:"wide",adminPeople:"wide",orders:"wide",divisions:"wide",event:"mid",teamJoin:"mid"};
const statusChip = s => ({open:'<span class="chip open">Регистрация открыта</span>',live:'<span class="chip live">Идёт</span>',ended:'<span class="chip ended">Завершён</span>',draft:'<span class="chip neutral">Черновик</span>'}[s]);
const isPub = e => e.status!=="draft";
function divState(d){
  if (d.taken>=d.limit) return {k:"full",t:"Мест нет"};
  if (d.taken/d.limit>=0.85) return {k:"warn",t:"Почти заполнена"};
  return {k:"ok",t:"Есть места"};
}
const hasReg = (evId, who="me") => ORDERS.some(o=>o.event===evId && ACTIVE_ST.includes(o.status) && (o.who||"me")===who);
const personOf = who => who==="me" ? ME : ME.kids.find(k=>k.id===who);
const person = () => personOf(S.who);
const athleteAge = (ev, p=person()) => !p || !p.dob ? NaN : ev.ageMode==="year" ? (+ev.date.slice(0,4) - +p.dob.slice(0,4)) : ageOn(p.dob, ev.date);
/* a guest sees every category but can enter none; the profile (and children in it) decides what opens */
const WHY_LOGIN = "Войдите, чтобы записаться", WHY_PROFILE = "Заполните анкету участника";
function eligibility(ev, d){
  if (ev.permanent ? !["open","live"].includes(ev.status) : (ev.status!=="open" && !(ev.status==="live" && TODAY<=ev.regTo))) return "Регистрация закрыта";
  if (!USER) return WHY_LOGIN;
  const p = person();
  if (!profileReady() || !p || !p.dob || !p.gender) return WHY_PROFILE;
  if (hasReg(ev.id, S.who)) return S.who==="me" ? "Вы уже зарегистрированы на этот старт" : `${p.first} уже зарегистрирован на этот старт`;
  const age = athleteAge(ev, p);
  if (d.g!=="any" && d.g!==p.gender) return d.g==="M" ? "Категория для мужского пола" : "Категория для женского пола";
  if (d.min && age<d.min) return `С ${d.min} лет`;
  if (d.max && age>d.max) return `Для участников до ${d.max} лет`;
  if (d.type!=="team" && d.taken>=d.limit) return "Мест нет";
  return null;
}

/* event page sections: built-in ones can be renamed, hidden and reordered; custom ones hold free text */
const DEF_SECTIONS = [["info","Детали"],["divs","Категории"],["schedule","Расписание"],["wods","Задания"]];
const SEC_HINT = {info:"Описание, даты, место, возврат, документы", divs:"Список категорий и свободные места", schedule:"Программа по дням (в лиге — итоги по месяцам)", wods:"Задания старта"};
function evSections(ev){
  if (!Array.isArray(ev.sections) || !ev.sections.length) ev.sections = DEF_SECTIONS.map(([k,label])=>({k,label,on:true}));
  DEF_SECTIONS.forEach(([k,label])=>{ if (!ev.sections.some(x=>x.k===k)) ev.sections.push({k,label,on:false}); });
  return ev.sections;
}
const textHtml = t => String(t||"").trim().split(/\n\s*\n/).map(p=>`<p style="margin:0 0 10px">${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
const takenOf = ev => ev.divisions.reduce((a,x)=>a+x.taken,0);
function evCount(ev){
  const cell = (b,t) => `<div><b>${b}</b><span>${t}</span></div>`, n = takenOf(ev), left = d => Math.max(0, daysBetween(TODAY, d));
  if (ev.permanent){ const m=curMonth(ev); return `<div class="count">${cell(monthTitle(m.id),"идёт месяц")}${cell(left(monthEnd(m.id)),"дней до итогов месяца")}${cell(n,"участников в лиге")}</div>`; }
  if (ev.status==="ended") return `<div class="count">${cell(n,"участвовали")}${cell(ev.divisions.length,"категорий")}${cell(ev.workouts.length,"заданий")}</div>`;
  if (ev.status==="live") return `<div class="count">${ev.submitTo?cell(left(ev.submitTo),"дней на сдачу результатов"):cell(evDays(ev).length,"дней старта")}${TODAY<=ev.regTo?cell(left(ev.regTo),"дней на регистрацию"):cell("—","регистрация закрыта")}${cell(n,"уже записались")}</div>`;
  if (ev.status==="draft") return "";
  return `<div class="count">${cell(left(ev.date),"дней до старта")}${cell(left(ev.regTo),"дней на регистрацию")}${cell(n,"уже записались")}</div>`;
}

event(){

    ${(ev.docs||[]).length?`<h2 class="sec">Документы</h2><div class="card" style="padding:4px 14px">${ev.docs.map(d=>`<div class="arow"><span class="chip neutral">${extOf(d.name)}</span><div class="sp"><b>${esc(d.title||d.name)}</b><div class="muted tiny">${esc(d.name)} · ${fmtSize(d.size)}</div></div><a class="btn sm" href="${d.data}" download="${esc(d.name)}">Скачать</a></div>`).join("")}</div>`:""}

      <div class="it"><b>3</b><div><strong>${ev.format==="online"?"Сдайте результаты с видео":"Пройдите регистрацию на месте"}</strong><div class="muted small">${ev.format==="online"?"Судьи проверяют видео, после этого результат попадает в лидерборд.":"Покажите QR-код из профиля, получите номер и пройдите брифинг."}</div></div></div>
    </div>`;
  if (t==="divs") body = ["ind","team"].map(type=>{ const ds=ev.divisions.filter(d=>d.type===type); if(!ds.length) return ""; return `<h2 class="sec">${type==="ind"?"Индивидуальные":"Командные"}</h2><div class="card stack" style="gap:0">${ds.map(d=>{const s=divState(d);return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="sp">${esc(d.name)}<span class="muted tiny"> · ${d.size?`${d.size} чел. · `:""}${ageLabel(d,ev)}${divDaysNote(ev,d)}</span></span><span class="chip ${s.k}">${s.t}</span></div>`}).join("")}</div>`;}).join("");

      <button class="btn ghost" data-lbmonth="year" data-lbev="${ev.id}">Таблица года</button></div>

    body = !ev.schedule.length ? '<div class="empty">Расписание пока не опубликовано</div>'
      : multi ? days.map(d=>{ const its=ev.schedule.filter(s=>(s[3]||days[0])===d).sort((a,b)=>a[0].localeCompare(b[0])); return `<h2 class="sec">${dayLabel(ev,d)}</h2><div class="card timeline">${its.map(item).join("") || '<div class="muted small" style="padding:10px 0">Программа дня уточняется</div>'}</div>`; }).join("")

  return {title:ev.name, html:`<div class="tabs" role="tablist">${tabsHtml}</div><div style="margin-top:14px">${body}</div>
   <div class="sticky-cta" style="bottom:64px">${hasReg(ev.id)?`<button class="btn block dark" data-go="orders">Вы зарегистрированы · Мои старты</button>`:canReg?`<button class="btn block" data-go="divisions" data-ev="${ev.id}">Зарегистрироваться</button>`:`<button class="btn block" disabled>${ev.status==="draft"?"Черновик — участники его не видят":"Регистрация закрыта"}</button>`}</div><div style="height:70px"></div>`, after:()=>{ const b=document.querySelector('#view .tabs [aria-selected="true"]'); if (b && b.parentElement) b.parentElement.scrollLeft = b.offsetLeft - 8; }};
},
divisions(){
  const ev = EVENTS.find(e=>e.id===S.p.ev), type = S.p.type || "ind";
  const ds = ev.divisions.filter(d=>d.type===type);
  const avail=[], off=[];
  ds.forEach(d=>{ const why=eligibility(ev,d); (why?off:avail).push({d,why}); });
  const gate = ds.some(d=>{ const w=eligibility(ev,d); return w===WHY_LOGIN || w===WHY_PROFILE; });
  const card = ({d,why}) => { const s=divState(d); const pct=Math.min(100,Math.round(d.taken/d.limit*100));
    const label = d.type==="team" ? (s.k==="full"?"Вступить в команду":"Записаться") : "Записаться";
    return `<div class="div ${why?"off":""}">
      <div><h4>${esc(d.name)}</h4><div class="muted tiny" style="margin-top:3px">${d.type==="team"?`Команда из ${d.size}`:"Индивидуально"} · ${ageLabel(d,ev)}${divDaysNote(ev,d)}${d.note?` · ${esc(d.note)}`:""}</div></div>
      <span class="chip ${s.k}">${s.t}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div><span class="price">${fmtRub(d.price)}</span><span class="muted tiny"> ${d.type==="team"?"с участника":""}</span><div class="muted tiny mono">${d.taken} из ${d.limit} ${d.type==="team"?"команд":"мест"}</div></div>
      ${why===WHY_LOGIN?`<button class="btn sm ghost" data-act="divlogin">Войти и записаться</button>`:why===WHY_PROFILE?`<button class="btn sm ghost" data-act="divprofile">Заполнить анкету</button>`:why?`<button class="btn sm" disabled>${esc(why)}</button>`:`<button class="btn sm" data-pick="${d.id}">${label} →</button>`}

leaderboard(){
  const L = S.lb;
  if (!EVENTS.some(e=>e.id===L.ev && isPub(e))){ const f = EVENTS.find(isPub); if (!f) return {title:null, html:'<div class="empty">Стартов пока нет</div>'}; L.ev=f.id; L.div="m"; L.w=-1; }
  const ev0 = EVENTS.find(e=>e.id===L.ev);
  let month = null;
  if (ev0.permanent){ if (L.month!=="year" && !(ev0.months||[]).some(m=>m.id===L.month)) L.month = curMonth(ev0).id; month = L.month; }
  let ev = month==="year" ? leagueYear(ev0, L.div).ev : lbEv(ev0, month);
  const mpills = ev0.permanent ? `<div class="pills" role="tablist" style="margin-top:10px">${(ev0.months||[]).map(m=>`<button role="tab" aria-selected="${month===m.id}" data-lbm="${m.id}">${monthTitle(m.id)}${m.done?"":" · идёт"}</button>`).join("")}<button role="tab" aria-selected="${month==="year"}" data-lbm="year">Таблица года</button></div>` : "";
  const head = `<div class="card" style="padding:12px 14px"><button class="selbtn" data-act="evsheet"><div><div class="row" style="gap:6px;margin-bottom:6px">${statusChip(ev.status)}</div><b>${ev.name}</b></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button></div>
   <div class="utabs" role="tablist" style="margin-top:10px">${[["ind","Атлеты"],["team","Команды"],["aff","Залы"]].map(([k,t])=>`<button role="tab" aria-selected="${L.tab===k}" data-lbt="${k}">${t}</button>`).join("")}</div>${L.tab==="aff"?"":mpills}`;
  if (ev.status==="open") return {title:null, html: head + `<div class="empty" style="margin-top:16px">Старт ${dHuman(ev.date)}. Лидерборд заполнится, когда судьи внесут первые результаты.</div>`};
  if (L.tab==="aff") return {title:null, html: head + affBoard(ev)};
  const hasRes = d => month==="year" ? (ev0.months||[]).some(m=>RESULTS[resKey(ev0,d.id,m.id)]) : RESULTS[resKey(ev0,d.id,month)];
  const divs = ev.divisions.filter(d=> L.tab==="team" ? d.type==="team" : d.type==="ind").filter(hasRes);
  if (!divs.length && ev0.permanent) return {title:null, html: head + '<div class="empty" style="margin-top:16px">За этот месяц результатов пока нет</div>'};
  if (!divs.length) return {title:null, html: head + '<div class="empty" style="margin-top:16px">В этом старте нет командных категорий с результатами</div>'};
  if (!divs.find(d=>d.id===L.div)) L.div = divs[0].id;
  const lbr = month==="year" ? leagueYear(ev0, L.div) : leaderboard(ev0.id, L.div, month);
  const rows = lbr.rows; ev = lbr.ev;
  const q = L.q.trim().toLowerCase();
  const wi = month==="year" ? -1 : Math.min(L.w, ev.workouts.length-1);
  let list = rows;
  if (wi>=0){ const w=ev.workouts[wi]; list=[...rows].sort((a,b)=>a.wr[wi]-b.wr[wi]); }
  const shown = q ? list.filter(r=>r.n.toLowerCase().includes(q)) : list;
  const html = head + `
   <div class="filters" style="margin-top:12px"><select class="inp" id="lbDiv" aria-label="Категория">${divs.map(d=>`<option value="${d.id}" ${d.id===L.div?"selected":""}>${d.name}</option>`).join("")}</select>
   <button class="iconbtn" data-act="lbsearch" aria-label="Поиск"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></div>
   ${S.searchOpen?`<input class="inp" id="lbq" style="margin-top:8px" placeholder="Имя атлета или команды" value="${esc(L.q)}" autocomplete="off">`:""}
   ${month==="year"?"":`<div class="pills" role="tablist" style="margin-top:12px"><button role="tab" aria-selected="${wi<0}" data-lbw="-1">${ev0.permanent?"Итог месяца":"Общий зачёт"}</button>${ev.workouts.map((w,i)=>`<button role="tab" aria-selected="${wi===i}" data-lbw="${i}">${w.name.split(" · ")[0]}</button>`).join("")}</div>`}
   <div class="lb-head" style="margin-top:8px"><span>#</span><span></span><span>${L.tab==="team"?"Команда":"Атлет"}</span><span class="wcols">${wi<0?ev.workouts.map(w=>`<span class="wc">${esc(w.name.split(" · ")[0])}</span>`).join(""):""}</span><span class="hpts">${wi<0?"Очки":"Результат"}</span><span></span></div>
   <div class="lb">${shown.map(r=>row(r,ev,wi)).join("") || '<div class="empty">Никого не нашли</div>'}</div>
   ${month==="year"?'<div class="rule" style="margin-top:12px">Таблица года: очки — сумма мест за месяцы, меньше значит выше. Пропущенный месяц — место «последний + 1».</div>':wi<0?'<div class="rule" style="margin-top:12px">Очки — сумма мест по заданиям, меньше значит выше. Равный результат делит место, следующее пропускается. Без результата — место «последний + 1».</div>':""}`;
  return {title:null, html};
},

function shiftEvent(ev, oldDate){
  const delta = daysBetween(oldDate, ev.date); if (!delta || ev.format==="online") return;

  ev.dateEnd = mv(ev.dateEnd);
  ev.schedule.forEach(s=>{ if (s[3]) s[3]=mv(s[3]); });
  ev.workouts.forEach(w=>{ if (w.day) w.day=mv(w.day); });
  ev.divisions.forEach(d=>{ if (d.days) d.days=d.days.map(mv); });
}
/* after the dates change, move every item that fell outside the start's days onto the nearest day */
function fitDays(ev){
  if (ev.format==="online") return 0;
  const days=evDays(ev), first=days[0], last=days[days.length-1]; let moved=0;
  const fit = d => { if (!d || days.includes(d)) return d; moved++; return d>last ? last : first; };
  ev.schedule.forEach(s=>{ if (s[3]) s[3]=fit(s[3]); });
  ev.workouts.forEach(w=>{ if (w.day) w.day=fit(w.day); });
  ev.divisions.forEach(d=>{ if (d.days && d.days.length){ const k=d.days.filter(x=>days.includes(x)); if (k.length!==d.days.length){ moved++; d.days=k; } } });
  return moved;
}

  if (ds.act==="psave"){

async function api(method, url, body){
  const opt = {method, headers:{}, credentials:"same-origin"};
  if (body!==undefined && method!=="GET"){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
  let r; try { r = await fetch(url, opt); } catch(_){ throw new Error("Нет связи с сервером. Проверьте интернет"); }
  let data = {}; try { data = await r.json(); } catch(_){}
  if (!r.ok) throw Object.assign(new Error(data.error || "Ошибка сервера. Попробуйте ещё раз"), {status:r.status});
  return data;
}

/* ---------- QR ---------- */
let qrTimer = null;
function drawQR(){
  const c = document.getElementById("qr"); if(!c) return;
  let seed = Math.floor(Date.now()/60000);
  const rnd = () => (seed = (seed*1103515245+12345) % 2147483648) / 2147483648;
  const x = c.getContext("2d"), N=25, s=c.width/N;
  x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.fillStyle="#111";
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(rnd()>.52) x.fillRect(i*s,j*s,s,s);
  const finder=(cx,cy)=>{ x.fillStyle="#fff"; x.fillRect(cx*s,cy*s,8*s,8*s); x.fillStyle="#111"; x.fillRect(cx*s,cy*s,7*s,7*s); x.fillStyle="#fff"; x.fillRect((cx+1)*s,(cy+1)*s,5*s,5*s); x.fillStyle="#111"; x.fillRect((cx+2)*s,(cy+2)*s,3*s,3*s); };
  finder(0,0); finder(N-7,0); finder(0,N-7);
  x.fillStyle="#F7B100"; x.fillRect(10*s,10*s,5*s,5*s);
  clearInterval(qrTimer);
  qrTimer = setInterval(()=>{ const el=document.getElementById("qrT"); if(!el){clearInterval(qrTimer);return;} const left=60-Math.floor(Date.now()/1000)%60; el.textContent=`Обновится через ${left} с`; if(left===60) drawQR(); },1000);
}

  if (S.route==="adminEvent") syncEv(); else if (S.route==="adminDiv") syncDiv(); else if (S.route==="adminWod") syncWod(); else if (S.route==="adminSch") syncSch(); else if (S.route==="adminPromo") syncPromo(); else if (S.route==="admin") syncAcc();
  if (S.route==="club") syncTrial();
  if (clubClick(t, ds)) return;
  if (adminClick(t, ds)) return;
  if (ds.act==="back") return back();
  if (ds.tab) return tab(ds.tab);
  if (ds.tabGo){ S.stack=[]; if(ds.sub){ S.route=ds.tabGo; S.p={}; if (!USER && ds.sub!=="orders"){ S.login={step:"email",email:"",ok:false,err:"",why:ds.sub==="admin"?"Вход для организаторов: используйте email, на который вам выдали доступ":""}; S.after={route:ds.sub,p:{}}; return go("login",{}); } go(ds.sub,{}); } else tab(ds.tabGo); return; }
  if (ds.go==="event") return go("event",{ev:ds.ev,t:ds.t});
  if (ds.go==="divisions"){
    const ev = EVENTS.find(x=>x.id===ds.ev); S.who="me"; if (!ev) return;
    if (ME.kids.length && !ev.divisions.some(d=>!eligibility(ev,d))){ const k = ME.kids.find(k=>{ S.who=k.id; return ev.divisions.some(d=>!eligibility(ev,d)); }); S.who = k ? k.id : "me"; }
    return go("divisions",{ev:ds.ev});
  }
  if (ds.go==="teamCreate"||ds.go==="teamJoin") return go(ds.go,{});
  if (ds.go==="profile" && ds.edit) return go("profile",{edit:true});
  if (ds.go) return go(ds.go,{});
  if (ds.evf){ S.p={f:ds.evf}; return render(); }
  if (ds.evt){ S.p={...S.p,t:ds.evt}; return render(); }
  if (ds.dtype){ S.p={...S.p,type:ds.dtype}; return render(); }
  if (ds.act==="divlogin") return needLogin("Войдите, чтобы записаться на старт");
  if (ds.act==="divprofile") return go("profile",{edit:true,then:"divisions"});
  if (ds.pick){
    const ev = EVENTS.find(x=>x.id===S.p.ev), div = ev.divisions.find(d=>d.id===ds.pick);
    if (!USER) return needLogin("Войдите, чтобы записаться на старт");
    if (!profileReady()) { toast("Сначала заполните анкету участника"); return go("profile",{edit:true,then:"divisions"}); }
    S.reg = {ev,div,team:null,who:S.who,f:{size:"L",promo:"",promoOk:false,promoMsg:"",c1:false,c2:false,c3:false}};
    return go(div.type==="team"?"team":"form",{});
  }
  if (ds.join){ S.p={...S.p,pick:ds.join,err:null}; render(); const i=document.getElementById("jCode"); i&&i.focus(); return; }
  if (ds.act==="promo"){ const v=document.getElementById("rPromo").value.trim().toUpperCase(); S.reg.f.promo=v; keepForm();
    api("POST","/api/promo",{code:v,event:S.reg.ev.id,div:S.reg.div.id}).then(res=>{ S.reg.f.promoOk=true; S.reg.f.promoOff=res.off; S.reg.f.promoMsg=`Скидка ${res.label} применена: −${fmtRub(res.off)}`; render(); })
      .catch(err=>{ S.reg.f.promoOk=false; S.reg.f.promoOff=0; S.reg.f.promoMsg=err.message; render(); }); return; }
  if (ds.act==="evsheet") return evSheet();
  if (ds.lbt){ S.lb.tab=ds.lbt; S.lb.w=-1; S.lb.open=null; S.lb.div = ds.lbt==="team"?"pair":"m"; return render(); }
  if (ds.lbw!==undefined){ S.lb.w=+ds.lbw; return render(); }
  if (ds.lbm){ S.lb.month=ds.lbm; S.lb.w=-1; S.lb.open=null; return render(); }
  if (ds.lbmonth){ S.lb.ev=ds.lbev; S.lb.month=ds.lbmonth; S.lb.w=-1; S.lb.open=null; S.lb.tab="ind"; S.lb.div="m"; return tab("leaderboard"); }
  if (ds.act==="lbsearch"){ S.searchOpen=!S.searchOpen; if(!S.searchOpen) S.lb.q=""; render(); const i=document.getElementById("lbq"); i&&i.focus(); return; }
  if (ds.row!==undefined){ S.lb.open = S.lb.open===ds.row?null:ds.row; return render(); }
  if (ds.refund){ S.p={...S.p,refund:ds.refund}; return render(); }
  if (ds.refundNo!==undefined){ S.p={...S.p,refund:null}; return render(); }
  if (ds.refundOk){ api("POST","/api/refund",{id:ds.refundOk}).then(async r=>{ replaceOrder(r.order); S.p={}; await loadContent(); render(); toast("Запрос отправлен организатору"); }).catch(err=>toast(err.message)); return; }
  if (ds.pubtoggle){ const o=ORDERS.find(x=>x.id===ds.pubtoggle); api("POST","/api/publish",{id:o.id,publish:!o.publish}).then(async r=>{ replaceOrder(r.order); await loadContent(); render(); toast(r.order.publish?"Имя будет видно в лидерборде":"В лидерборде вы будете «Участник №…»"); }).catch(err=>toast(err.message)); return; }
  if (ds.so!==undefined){ S.p={o:+ds.so,w:0}; return render(); }
  if (ds.act==="logout"){ api("POST","/api/auth/logout",{}).finally(()=>{ location.hash=""; location.reload(); }); return; }
  if (ds.act==="lagain"){ S.login={...S.login,step:"email",err:""}; return render(); }
  if (ds.act==="kidadd"){ syncProfile(); S.p.v.kids.push({id:"",first:"",last:"",gender:"M",dob:""}); return render(); }
  if (ds.kiddel!==undefined){ syncProfile(); S.p.v.kids.splice(+ds.kiddel,1); return render(); }
  if (ds.act==="accdelask"){ S.p={...S.p,delAsk:true}; return render(); }
  if (ds.act==="accdelno"){ S.p={...S.p,delAsk:false}; return render(); }
  if (ds.act==="accdelyes"){ api("POST","/api/account/delete",{}).then(()=>{ location.hash=""; location.reload(); }).catch(err=>toast(err.message)); return; }
  if (ds.sw!==undefined){ S.p={o:S.p.o,w:+ds.sw}; return render(); }
});
function keepForm(){ const f=S.reg.f; const g=id=>document.getElementById(id); if(g("rSize")) f.size=g("rSize").value; if(g("rAff")) f.aff=g("rAff").value; ["c1","c2","c3","c4","c5"].forEach(k=>{ if(g(k)) f[k]=g(k).checked; }); }
document.addEventListener("change", e=>{
  const id = e.target.id;
  if (["c1","c2","c3","c4","c5","rSize","rAff"].includes(id)){ keepForm(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  if (id==="lbDiv"){ S.lb.div=e.target.value; S.lb.open=null; render(); }
  if (id==="pEv"){ syncPromo(); const el=document.getElementById("promoPrev"); if (el) el.innerHTML=promoPreview(); }
  if (id==="aDate" || id==="aDateEnd"){
    const ev=curEv(), oldDate=ev.date;
    syncEv();
    if (id==="aDate" && oldDate && ev.date && oldDate!==ev.date) shiftEvent(ev, oldDate);
    if (ev.date && fitDays(ev)){ adm.err.days=null; toast("Программа и задания перенесены в новые даты старта"); }
    const y=window.scrollY; render(); window.scrollTo(0,y);
  }
  if (id==="sCap"){ S.p={...S.p,cap:e.target.checked,err:null}; render(); }
});
document.addEventListener("input", e=>{
  if (e.target.id==="pVal"){ syncPromo(); const el=document.getElementById("promoPrev"); if (el) el.innerHTML=promoPreview(); }
  if (e.target.id==="dMin"||e.target.id==="dMax"){ syncDiv(); const w=document.getElementById("whoTxt"); if(w) w.innerHTML=whoText(); }
  if (e.target.id==="tq"){ S.p={...S.p,q:e.target.value,pick:null}; const pos=e.target.selectionStart; render(); const i=document.getElementById("tq"); i.focus(); i.setSelectionRange(pos,pos); }
  if (e.target.id==="lbq"){ S.lb.q=e.target.value; const pos=e.target.selectionStart; render(); const i=document.getElementById("lbq"); i.focus(); i.setSelectionRange(pos,pos); }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  const g=id=>document.getElementById(id);
  if (e.target.id==="fLogin"){
    const L=S.login; L.email=g("lEmail").value.trim().toLowerCase(); L.ok=g("lOk").checked;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(L.email)){ L.err="Проверьте email"; return render(); }
    if (!L.ok){ L.err="Нужно согласие на обработку персональных данных"; return render(); }
    L.busy=true; L.err=""; render();
    api("POST","/api/auth/code",{email:L.email,consent:true}).then(()=>{ L.busy=false; L.step="code"; render(); }).catch(err=>{ L.busy=false; L.err=err.message; render(); });
    return;
  }
  if (e.target.id==="fCode"){
    const L=S.login, code=g("lCode").value.replace(/\D/g,"");
    if (code.length!==6){ L.err="Код — 6 цифр из письма"; return render(); }
    L.busy=true; L.err=""; render();
    api("POST","/api/auth/verify",{email:L.email,code}).then(async()=>{ await loadSession(); await loadContent(); S.login=null; const a=S.after; S.after=null; S.stack=[];
      if (a && a.route && !["login","me"].includes(a.route)){ S.route=a.route; S.p=a.p||{}; render(); } else go(profileReady()?"me":"profile",{edit:!profileReady()},false);
      toast("Вы вошли"); }).catch(err=>{ L.busy=false; L.err=err.message; render(); });
    return;
  }
  if (e.target.id==="fProfile"){
    syncProfile(); const v=S.p.v, er={};
    if (!v.last) er.last="Укажите фамилию"; if (!v.first) er.first="Укажите имя"; if (!v.dob) er.dob="Укажите дату рождения";
    if (v.phone.replace(/\D/g,"").length<10) er.phone="Нужен телефон для связи";
    if (v.kids.some(k=>!k.first||!k.last||!k.dob)) er.kids="У каждого ребёнка нужны имя, фамилия и дата рождения";
    if (Object.keys(er).length){ S.p={...S.p,e:er}; return render(); }
    S.p={...S.p,busy:true,e:{}}; render();
    api("PUT","/api/profile",{profile:v,kids:v.kids}).then(r=>{ Object.assign(ME,r.profile); ME.kids=r.kids; USER.profile=r.profile; USER.kids=r.kids; const then=S.p.then; toast("Анкета сохранена"); if (then) back(); else go("profile",{},false); })
      .catch(err=>{ S.p={...S.p,busy:false,e:{send:err.message}}; render(); });
    return;
  }
  if (e.target.id==="fTeam"){
    const v={name:g("tName").value.trim(),aff:g("tAff").value,code:g("tCode").value.trim(),code2:g("tCode2").value.trim()}, er={};
    const words=v.name.split(/\s+/).filter(Boolean);
    if (!/^[A-Za-z ]+$/.test(v.name) || v.name.length>20 || words.length>5) er.name="Название: только латинские буквы и пробелы, до 5 слов и 20 символов";
    else if ((TEAMS[`${S.reg.ev.id}:${S.reg.div.id}`]||[]).some(t=>t.name===v.name.toUpperCase())) er.name="Команда с таким названием уже есть в этой категории";
    if (!/^\d{4,6}$/.test(v.code)) er.code="Код — от 4 до 6 цифр"; else if (v.code!==v.code2) er.code="Коды не совпадают";
    if (er.name||er.code){ S.p={v,e:er}; return render(); }
    S.reg.team=v.name.toUpperCase(); S.reg.newTeam=true; S.reg.teamReq={mode:"create",name:S.reg.team,code:v.code}; return go("form",{});
  }
  if (e.target.id==="fJoin"){
    const jc=g("jCode").value.trim(); if (!/^\d{4,6}$/.test(jc)){ S.p={...S.p,err:"Код — от 4 до 6 цифр. Уточните его у капитана"}; render(); g("jCode")&&g("jCode").focus(); return; }
    S.reg.team=S.p.pick; S.reg.newTeam=false; S.reg.teamReq={mode:"join",name:S.p.pick,code:jc}; return go("form",{});
  }
  if (e.target.id==="fReg"){ keepForm(); return submitReg(); }
  if (e.target.id==="fScore"){
    const T=scoreTargets(), ti=Math.min(S.p.o??0,T.length-1), {o,ws}=T[ti], wi=Math.min(S.p.w??0,ws.length-1), w=ws[wi]; const raw=g("sVal").value.trim(), vid=g("sVid").value.trim(); let val;
    if (w.type==="time" && !S.p.cap){ const m=raw.match(/^(\d{1,2}):([0-5]\d)$/); if(!m){S.p={...S.p,err:"Время в формате мм:сс, например 13:45"};return render();} val=+m[1]*60+ +m[2]; if(val>w.cap){S.p={...S.p,err:`Это больше лимита ${Math.floor(w.cap/60)}:00 — отметьте «Не уложился»`};return render();} }
    else { const n=Number(raw.replace(",",".")); if(!raw||!isFinite(n)||n<=0){S.p={...S.p,err:"Введите число больше нуля"};return render();} val = (w.type==="time") ? {cap:Math.round(n)} : n; }
    if (!/^https?:\/\/\S+\.\S+/.test(vid)){ S.p={...S.p,err:"Нужна ссылка на видео: VK Видео, YouTube или облако"}; return render(); }
    S.p={...S.p,busy:true,err:null}; render();
    api("POST","/api/score",{reg:o.id,workout:w.id,value:val,video:vid}).then(r=>{ MYSCORES=MYSCORES.filter(s=>!(s.reg_id===o.id&&s.workout_id===w.id)); MYSCORES.push(r.score); S.p={o:ti,w:wi}; render(); toast("Результат отправлен на проверку"); })
      .catch(err=>{ S.p={...S.p,busy:false,err:err.message}; render(); });
  }
});
if (location.hash==="#admin") S.route="admin";
if (location.hash==="#comp") S.route="home";
render();
(async()=>{
  try { await loadContent(); }
  catch(e){ LOAD_ERR = "Не получилось загрузить сайт. Обновите страницу через минуту"; render(); return; }
  try { await loadSession(); } catch(_){ USER=null; }
  LOADED = true; render();
})();
</script>
